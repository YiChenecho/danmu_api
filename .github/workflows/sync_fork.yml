name: Fork Sync

permissions:
    contents: write

on:
    schedule:
        - cron: "0 0 * * *"  # 每天午夜执行
    workflow_dispatch:  # 允许手动触发

concurrency:
    group: fork-sync-main
    cancel-in-progress: false

jobs:
    sync_with_upstream:
        name: Sync with Upstream
        runs-on: ubuntu-latest
        if: ${{ github.event.repository.fork }}

        steps:
            - name: Checkout target repo
              uses: actions/checkout@v5
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fetch-depth: 0

            - name: Sync upstream while preserving local workflows
              shell: bash
              run: |
                  set -euo pipefail

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git remote add upstream https://github.com/huangxd-/danmu_api.git 2>/dev/null ||                       git remote set-url upstream https://github.com/huangxd-/danmu_api.git
                  git fetch --no-tags upstream main

                  if git merge-base --is-ancestor upstream/main HEAD; then
                      echo "Already up to date with upstream/main."
                      exit 0
                  fi

                  before="$(git rev-parse HEAD)"

                  # Merge upstream normally. If only workflow files conflict, keep the
                  # fork-local versions because GITHUB_TOKEN cannot push workflow edits.
                  set +e
                  git merge --no-ff --no-edit upstream/main
                  merge_status=$?
                  set -e

                  if [ "$merge_status" -ne 0 ]; then
                      non_workflow_conflicts="$(
                          git diff --name-only --diff-filter=U |                               grep -v '^\.github/workflows/' || true
                      )"

                      if [ -n "$non_workflow_conflicts" ]; then
                          echo "::error::Merge conflicts outside .github/workflows:"
                          echo "$non_workflow_conflicts"
                          exit 1
                      fi

                      echo "Resolving workflow-only conflicts by keeping fork-local workflows."
                      git restore --source="$before" --staged --worktree -- .github/workflows/
                      git add -A .github/workflows/
                      git commit --no-edit
                  else
                      # The merge may have changed workflow files without a conflict.
                      # Restore the fork's workflow directory before pushing.
                      git restore --source="$before" --staged --worktree -- .github/workflows/

                      if ! git diff --cached --quiet || ! git diff --quiet; then
                          git add -A .github/workflows/
                          git commit --amend --no-edit
                      fi
                  fi

                  git push origin HEAD:main
                  echo "Sync completed successfully."

            - name: Check for Failure
              if: failure()
              run: |
                  echo "[Error] Sync failed."
                  echo "If conflicts are listed above, resolve those non-workflow files manually."
                  exit 1
